name: Android Build

on:
    push:
        branches: [main, develop]
        paths:
            - 'src/**'
            - 'android/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'app.json'
            - 'app.config.ts'
    pull_request:
        branches: [main, develop]
        paths:
            - 'src/**'
            - 'android/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'app.json'
            - 'app.config.ts'
    workflow_dispatch:

jobs:
    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Materialise environment
              # `expo export` reads .env through app.config.ts, and .env* is gitignored, so
              # CI had none. The export still succeeded — bundling never constructs the HTTP
              # client — but the artifact threw "API_URL is not set" on first use, and
              # nothing caught it. The example file carries valid placeholder values, so
              # this makes the export representative and lets the gate below actually run.
              run: cp .env.example .env

            - name: Validate environment
              run: pnpm check:env

            - name: Build Android
              run: pnpm exec expo export --platform android

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: android-build
                  path: dist/
                  retention-days: 7
