name: iOS Build

on:
    push:
        branches: [main, develop]
        paths:
            - 'src/**'
            - 'ios/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'app.json'
            - 'app.config.ts'
    pull_request:
        branches: [main, develop]
        paths:
            - 'src/**'
            - 'ios/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'app.json'
            - 'app.config.ts'
    workflow_dispatch:

jobs:
    build-ios:
        name: Build iOS
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: 'latest'

            - name: Setup CocoaPods
              run: |
                  cd ios
                  pod install

            - name: Materialise environment
              # `expo export` reads .env through app.config.ts, and .env* is gitignored, so
              # CI had none. The export still succeeded — bundling never constructs the HTTP
              # client — but the artifact threw "API_URL is not set" on first use, and
              # nothing caught it. The example file carries valid placeholder values, so
              # this makes the export representative and lets the gate below actually run.
              run: cp .env.example .env

            - name: Validate environment
              run: pnpm check:env

            - name: Build iOS
              run: |
                  xcodebuild -workspace ios/NewReactNativeZustandRNQ.xcworkspace \
                    -scheme NewReactNativeZustandRNQ \
                    -configuration Debug \
                    -destination "platform=iOS Simulator,name=iPhone 16" \
                    build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              if: success()
              with:
                  name: ios-build
                  path: ios/build/
                  retention-days: 7
