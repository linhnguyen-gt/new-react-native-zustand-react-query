name: iOS Build

on:
    push:
        branches: [main, develop]
        paths:
            - 'src/**'
            - 'ios/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'app.json'
            - 'app.config.ts'
    pull_request:
        branches: [main, develop]
        paths:
            - 'src/**'
            - 'ios/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'app.json'
            - 'app.config.ts'
    workflow_dispatch:

jobs:
    build-ios:
        name: Build iOS
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: 'latest'

            - name: Setup CocoaPods
              run: |
                  cd ios
                  pod install

            - name: Materialise environment
              # `expo export` reads .env through app.config.ts, and .env* is gitignored, so
              # CI had none. The export still succeeded — bundling never constructs the HTTP
              # client — but the artifact threw "API_URL is not set" on first use, and
              # nothing caught it. The example file carries valid placeholder values, so
              # this makes the export representative and lets the gate below actually run.
              run: cp .env.example .env

            - name: Validate environment
              run: pnpm check:env

            - name: Build iOS
              # `generic/platform=iOS Simulator` rather than a named device. This job only
              # compiles, and compiling needs no concrete simulator — while a `name=` pins
              # the workflow to whatever device list the runner image happens to ship.
              # That pin broke: the runner moved to the iPhone 17 family and every run
              # failed with `xcodebuild: error: Unable to find a device matching the
              # provided destination specifier` (exit 70) on a name that had simply aged
              # out. A generic destination cannot age out. If this job ever runs tests it
              # will need a real device again — resolve one from `xcrun simctl list` at
              # runtime rather than hardcoding a name.
              #
              # `ARCHS` because a generic destination has no active architecture, so
              # xcodebuild otherwise builds every simulator arch — measured at exactly
              # 2490 object files for arm64 and 2490 more for x86_64, double the work to
              # answer a yes/no question. Reading it from the runner keeps that saving
              # without reintroducing a hardcode that can rot.
              #
              # It must be the `ARCHS=` build setting, not the `-arch` flag: combining
              # `-arch` with a destination fails with "destination implies architecture,
              # architecture must not also be specified".
              run: |
                  xcodebuild -workspace ios/NewReactNativeZustandRNQ.xcworkspace \
                    -scheme NewReactNativeZustandRNQ \
                    -configuration Debug \
                    -destination "generic/platform=iOS Simulator" \
                    ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO \
                    build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              if: success()
              with:
                  name: ios-build
                  path: ios/build/
                  retention-days: 7
