name: Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: 'Version bump'
                type: choice
                required: true
                default: auto
                options:
                    - auto
                    - patch
                    - minor
                    - major
            version:
                description: 'Exact version (x.y.z) — overrides the bump above'
                type: string
                required: false
                default: ''
            draft:
                description: 'Publish as a draft release'
                type: boolean
                required: false
                default: false

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            # The job pushes the version commit and the tag, and creates the release.
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Full history and tags: the notes are the commits since the previous
                  # tag, and the default shallow clone has neither.
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm lint

            - name: Run TypeScript
              run: pnpm lint:tsc

            - name: Run tests
              run: pnpm test:ci

            - name: Prepare release
              id: prepare
              env:
                  # Used for the "Full Changelog" compare link in the notes.
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: |
                  node scripts/prepare-release.cjs \
                    --bump=${{ inputs.bump }} \
                    ${{ inputs.version && format('--version={0}', inputs.version) || '' }}

            - name: Commit and tag
              env:
                  VERSION: ${{ steps.prepare.outputs.version }}
                  TAG: ${{ steps.prepare.outputs.tag }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add package.json
                  # --no-verify because lefthook's pre-commit hooks are installed by
                  # postinstall and would re-run lint and the test suite that this job
                  # has already run above.
                  git commit --no-verify -m "chore(release): ${TAG}"
                  git tag -a "${TAG}" -m "Release ${VERSION}"
                  git push origin HEAD:${{ github.ref_name }}
                  git push origin "${TAG}"

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.prepare.outputs.tag }}
                  NOTES_FILE: ${{ steps.prepare.outputs.notes_file }}
              run: |
                  gh release create "${TAG}" \
                    --title "${TAG}" \
                    --notes-file "${NOTES_FILE}" \
                    ${{ inputs.draft && '--draft' || '' }}

            - name: Summary
              env:
                  TAG: ${{ steps.prepare.outputs.tag }}
                  PREVIOUS_TAG: ${{ steps.prepare.outputs.previous_tag }}
                  COMMIT_COUNT: ${{ steps.prepare.outputs.commit_count }}
                  NOTES_FILE: ${{ steps.prepare.outputs.notes_file }}
              run: |
                  {
                    echo "## Released ${TAG}"
                    echo ""
                    echo "- Previous tag: ${PREVIOUS_TAG:-(none)}"
                    echo "- Commits included: ${COMMIT_COUNT}"
                    echo ""
                    cat "${NOTES_FILE}"
                  } >> "$GITHUB_STEP_SUMMARY"
