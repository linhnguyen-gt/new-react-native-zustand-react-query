allowBuilds:
  lefthook: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted

# form-data <4.0.6 is vulnerable to CRLF injection (GHSA-hmw2-7cc7-3qxx, high).
# It was reached through two roots -- axios directly, and dotenv-vault, which pinned
# an old axios with no upstream fix -- so the override had to be unscoped to cover
# both. dotenv-vault has since been removed in favour of EAS environment variables,
# leaving only axios, which already resolves a patched form-data on its own.
#
# The override stays as a floor: it costs nothing and stops a future dependency from
# quietly reintroducing the vulnerable range. Verify the tree with
# `pnpm why form-data`, not `pnpm audit`.
overrides:
  form-data@<4.0.6: '>=4.0.6'
